name = "kone-cloud"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── Non-secret variables (safe to commit) ──
[vars]
SCHEMA_VERSION = "1.0.0"

# ── Phase 2.9 云端二次门禁（AGENTS.md 宪法第 5 条）──
# 本地审批 UI 已就绪（线索表「批准」按钮 → cloud:create-approval），
# 可将本项改为 "true" 启用。启用后以下请求会被拒绝：
#   APPROVAL_REQUIRED（无审批记录）/ DRAFT_VERSION_MISMATCH（草稿版本不符）
#   COMPANY_CONFLICT（撞单保护期）/ SUPPRESSED（全局抑制）
#   EMAIL_GRADE_INSUFFICIENT（邮箱等级不足）/ QUOTA_EXCEEDED / CIRCUIT_OPEN
# 建议先在干净环境端到端验证一次（批准 → 发送至云端）再开生产。
APPROVAL_GATE_ENABLED = "false"

# ── D1 Binding ──
[[d1_databases]]
binding = "DB"
database_name = "kone-leads"
# [V1.4.3] 2026-10-08 补入。此前缺失本字段，导致 wrangler 无法解析配置
# （`d1_databases[0] bindings must have a "database_id" field`），
# 即云端从未真正部署过。由 `wrangler d1 create kone-leads` 生成。
database_id = "fab350bd-1772-40ea-8095-7886bdee5024"

# ── Queue Binding (Phase 2: outreach delivery) ──
# [[queues.producers]]
# binding = "OUTREACH_QUEUE"
# queue = "kone-outreach"

# ── Cron Trigger (Phase 2: sweep pending outreach) ──
# [triggers]
# crons = ["*/15 * * * *"]

# ── Secrets (use `wrangler secret put <name>`) ──
# RESEND_API_KEY = "re_xxx"
# RESEND_WEBHOOK_SECRET = "whsec_xxx"   # Svix-format; verify via x-resend-signature is NOT used
# SENDER_DOMAIN = "outreach.kone-cloud.com"
